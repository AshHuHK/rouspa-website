<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>柔療髮浴頭療測驗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout：沿用官網的單欄置中與大量留白；測驗以全螢幕柔和頁面一次只呈現一題 */
:root{
  --paper:#F4EFE7;      /* 暖白底 */
  --paper-hi:#FAF8F4;   /* 卡片底 */
  --tea:#EDE3D5;        /* 奶茶色（選取狀態） */
  --khaki:#B49C79;      /* 卡其色（框線、徽章） */
  --gold:#9A7A4C;       /* 品牌金棕（價格、標籤） */
  --gold-deep:#76592F;  /* 深金棕（主要按鈕、連結） */
  --ink:#463C32;        /* 主要文字 */
  --ink-soft:#6B6055;
  --muted:#8E8376;
  --line:#DDD1BF;
  --on-gold:#FFFDF8;
  --shade:rgba(92,72,45,.09);
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","Source Han Serif TC","PMingLiU",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
html.quiz-lock,html.quiz-lock body{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- 預覽提示 ---------- */
.preview-bar{margin:12px auto 0;max-width:560px;display:flex;gap:10px;align-items:flex-start;
  background:var(--tea);border:1px dashed var(--khaki);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.preview-bar b{color:var(--gold-deep);font-weight:600;white-space:nowrap}

/* ---------- 官網區塊示意 ---------- */
.site-head{max-width:560px;margin:14px auto 0;display:flex;justify-content:space-between;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.logo{font-size:15px;letter-spacing:.3em;color:var(--ink-soft)}
.logo small{display:block;font-size:10px;letter-spacing:.45em;color:var(--muted)}
.menu-btn{border:1.5px solid #8C7660;border-radius:10px;background:transparent;padding:6px 14px;display:flex;gap:10px;align-items:center;font-size:15px;letter-spacing:.1em;cursor:default}
.menu-btn i{display:grid;gap:4px}
.menu-btn i::before,.menu-btn i::after,.menu-btn i span{content:"";display:block;width:20px;height:2px;background:var(--ink)}

.services{max-width:520px;margin:0 auto;padding-block:56px 72px;text-align:center}
.eyebrow{font-size:13px;letter-spacing:.5em;color:var(--gold);margin:0 0 14px;padding-left:.5em}
.services h1{font-size:clamp(28px,8vw,38px);font-weight:600;letter-spacing:.22em;margin:0;padding-left:.22em;text-wrap:balance;line-height:1.4}
.rule{width:72%;height:1px;background:var(--khaki);opacity:.7;margin:24px auto}
.hint{font-size:14px;letter-spacing:.2em;color:var(--muted);margin:0 0 26px}

.entry-btn{flex:none;width:auto;min-width:min(100%, 280px);min-height:56px;gap:12px;padding:0 30px;font-size:17px;box-shadow:0 8px 22px rgba(92,72,45,.18)}
.entry-arrow{transition:transform .3s ease}
.entry-btn:hover .entry-arrow{transform:translateX(3px)}

.badge{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:600;color:var(--gold);
  background:radial-gradient(circle at 50% 38%,#FFFFFF 0,#F3ECE1 70%);border:2px solid var(--khaki);box-shadow:inset 0 0 0 4px var(--paper-hi), inset 0 0 0 5px #E7DCCB}

.faq-link{display:inline-block;margin-top:26px;color:var(--gold-deep);font-size:16px;letter-spacing:.06em;text-decoration:none;border-bottom:1.5px solid var(--gold-deep);padding-bottom:2px}
.tier{margin-top:52px}
.tier-h{font-size:22px;font-weight:600;letter-spacing:.08em;margin:0 0 18px;display:flex;justify-content:center;gap:22px;align-items:baseline;flex-wrap:wrap}
.tier-h .price{color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:18px;background:var(--paper-hi);border-radius:16px;padding:16px 20px;box-shadow:0 4px 18px var(--shade);text-align:left}
.row-name{flex:1;font-size:19px;font-weight:600;letter-spacing:.06em}
.row-chev{color:var(--gold)}

/* ---------- 測驗全螢幕 ---------- */
.quiz{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.quiz-top{position:sticky;top:0;z-index:2;background:var(--paper);
  padding-top:calc(env(safe-area-inset-top, 0px) + 10px);padding-bottom:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.quiz-top-in{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.quiz-brand{font-size:13px;letter-spacing:.35em;color:var(--muted)}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper-hi);cursor:pointer;font-size:20px;line-height:1;color:var(--ink-soft);display:grid;place-items:center}
.quiz-stage{max-width:600px;margin:0 auto;
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.screen{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion: reduce){
  .screen{animation:fadeonly .2s ease both}
  @keyframes fadeonly{from{opacity:0}to{opacity:1}}
  .breathe{animation:none!important}
  .entry-arrow,.opt,.pic,.pic .check{transition:none}
}
.screen h2{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

/* 題目 */
.progress{display:flex;align-items:center;gap:14px;margin:6px 0 26px}
.count{font-size:15px;letter-spacing:.12em;color:var(--gold-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bars i{height:3px;border-radius:2px;background:var(--line);transition:background .4s ease}
.bars i.on{background:var(--gold)}
.q-label{font-size:12px;letter-spacing:.28em;color:var(--gold);margin:0 0 10px}
.q-title{font-size:clamp(21px,5.6vw,26px);font-weight:600;letter-spacing:.06em;line-height:1.55;margin:0 0 24px;text-wrap:balance}

.opts{display:grid;gap:12px;border:0;padding:0;margin:0}
.opt{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--paper-hi);border:1px solid var(--line);border-radius:16px;cursor:pointer;
  transition:border-color .25s ease, background-color .25s ease, box-shadow .25s ease}
.opt:hover{border-color:var(--khaki)}
.opt input,.pic input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.mark{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;letter-spacing:0;color:var(--gold);
  border:1px solid var(--khaki);background:radial-gradient(circle at 50% 38%,#FFFFFF 0,#F1E9DD 75%);transition:all .25s ease}
.opt-text{flex:1;min-width:0;font-size:16px;line-height:1.65}
.opt.is-selected{border-color:var(--gold);background:var(--tea);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.is-selected .mark,.pic.is-selected .mark{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--on-gold)}
.opt:has(input:focus-visible),.pic:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:3px}

.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:0;padding:0;margin:0}
.pic{position:relative;display:flex;flex-direction:column;min-width:0;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--paper-hi);border:1px solid var(--line);
  transition:border-color .25s ease, box-shadow .25s ease}
.pic .img{position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden;background:var(--tea)}
.pic .img svg,.pic .img img{display:block;width:100%;height:100%;object-fit:cover;transition:filter .3s ease, transform .5s ease}
.pic:hover .img svg,.pic:hover .img img{transform:scale(1.03)}
.pic .cap{display:flex;gap:9px;align-items:flex-start;padding:11px 12px 13px;font-size:14.5px;line-height:1.55}
.pic .mark{width:24px;height:24px;font-size:12px;margin-top:1px}
.pic .cap span:last-child{min-width:0;text-wrap:pretty}
.opt-text,.reasons li,.alt-why{text-wrap:pretty}
.pic .check{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--gold-deep);color:var(--on-gold);display:grid;place-items:center;font-size:14px;
  opacity:0;transform:scale(.7);transition:opacity .25s ease, transform .25s ease;box-shadow:0 2px 8px rgba(60,44,22,.25)}
.pic.is-selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pic.is-selected .check{opacity:1;transform:none}
.pics.has-choice .pic:not(.is-selected) .img svg,.pics.has-choice .pic:not(.is-selected) .img img{filter:saturate(.6) opacity(.72)}

.nav{display:flex;gap:12px;margin-top:30px}
.btn{flex:1;min-height:52px;border-radius:999px;font-size:16px;letter-spacing:.14em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:0 18px;
  transition:opacity .2s ease, background-color .2s ease}
.btn-ghost{background:transparent;border:1px solid var(--khaki);color:var(--ink-soft)}
.btn-ghost:hover:not(:disabled){background:var(--paper-hi)}
.btn-solid{background:var(--gold-deep);border:1px solid var(--gold-deep);color:var(--on-gold)}
.btn-solid:hover:not(:disabled){background:#664C27}
.btn:disabled{opacity:.38;cursor:not-allowed}
.nav-hint{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 0;min-height:1.6em}

/* 分析中 */
.loading{text-align:center;padding-top:22vh}
.loading .badge{width:76px;height:76px;font-size:30px;margin:0 auto 22px}
.breathe{animation:breathe 1.6s ease-in-out infinite}
.loading p{letter-spacing:.16em;color:var(--ink-soft);margin:0}

/* 結果 */
.result-head{text-align:center;padding-top:14px;margin-bottom:22px}
.result-head h2{font-size:clamp(24px,6.6vw,30px);font-weight:600;letter-spacing:.16em;margin:0;padding-left:.16em}
.tie-note{font-size:14px;color:var(--ink-soft);background:var(--tea);border-radius:12px;padding:10px 14px;margin:14px 0 0;text-align:left}
.course{background:var(--paper-hi);border-radius:20px;overflow:hidden;box-shadow:0 10px 34px var(--shade);border:1px solid #E8DECF}
.course-img{aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--tea)}
.course-img svg,.course-img img{display:block;width:100%;height:100%;object-fit:cover}
.course-body{padding:22px 20px 24px;display:grid;gap:18px}
.course-title{display:grid;gap:4px}
.tag{justify-self:start;font-size:12px;letter-spacing:.2em;color:var(--on-gold);background:var(--gold-deep);border-radius:999px;padding:2px 10px}
.course-name{font-size:30px;font-weight:700;letter-spacing:.2em;margin:0;line-height:1.3}
.course-sub{font-size:15px;color:var(--gold);letter-spacing:.14em;margin:0}
.suits{font-size:14px;color:var(--muted);margin:0}
.sec-label{font-size:12px;letter-spacing:.3em;color:var(--gold);margin:0 0 8px;font-weight:500}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.reasons li{position:relative;padding-left:18px;font-size:15.5px;line-height:1.8;color:var(--ink)}
.reasons li::before{content:"";position:absolute;left:2px;top:.78em;width:6px;height:6px;border-radius:50%;background:var(--khaki)}
.features{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.features li{font-size:14px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;letter-spacing:.06em}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.meta .dur{font-size:15px;color:var(--ink-soft);letter-spacing:.1em}
.meta .price{font-size:24px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.actions{display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.actions .btn{min-width:140px}
.book-note{font-size:13.5px;color:var(--gold-deep);background:var(--tea);border-radius:10px;padding:8px 12px;margin:0}

.alts{margin-top:26px;display:grid;gap:12px}
.alts-h{font-size:12px;letter-spacing:.3em;color:var(--gold);margin:0;text-align:center}
.alt{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--paper-hi);border:1px solid #E8DECF;border-radius:16px;overflow:hidden}
.alt .course-img{aspect-ratio:auto;height:100%;min-height:120px}
.alt-body{padding:14px 14px 14px 0;display:grid;gap:6px;min-width:0}
.alt-name{font-size:20px;font-weight:700;letter-spacing:.14em;margin:0}
.alt-sub{font-size:13px;color:var(--gold);letter-spacing:.1em;margin:0}
.alt-why{font-size:14px;line-height:1.7;color:var(--ink-soft);margin:0}
.text-btn{background:none;border:0;padding:4px 0;color:var(--gold-deep);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:14.5px;letter-spacing:.06em;justify-self:start}

.care{margin-top:24px;font-size:13.5px;line-height:1.75;color:var(--ink-soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper)}
.care b{color:var(--ink);font-weight:600}
.after{display:flex;justify-content:center;margin-top:14px}

.detail{margin-top:22px;border:1px dashed var(--khaki);border-radius:14px;padding:10px 14px;font-size:14px;background:var(--paper)}
.detail summary{cursor:pointer;color:var(--gold-deep);letter-spacing:.06em}
.table-wrap{overflow-x:auto;margin-top:10px}
.detail table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:340px}
.detail th,.detail td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.detail th:first-child,.detail td:first-child{text-align:left}
.detail tfoot td{font-weight:700;color:var(--ink)}
.detail td.win{color:var(--gold-deep);font-weight:700}
.detail p{margin:10px 0 0;color:var(--muted);font-size:13px}

@media (min-width:720px){
  .q-title{margin-bottom:28px}
  .course-body{padding:26px 28px 28px}
  .alt{grid-template-columns:150px 1fr}
}
</style>

====================================================================== -->

<script>
(function () {
  "use strict";
  var S = window.ROU_QUIZ_SCORES, C = window.ROU_QUIZ_CONTENT, ART = window.ROU_QUIZ_ART;
  var ORDER = S.courseOrder;
  var QS = C.questions;

  /* ---------- 純計算（不碰畫面） ---------- */
  function scoreAnswers(answers) {
    var totals = {}, rows = [];
    ORDER.forEach(function (k) { totals[k] = 0; });
    QS.forEach(function (q) {
      var a = answers[q.id];
      if (!a) return;
      var pts = S.table[q.id][a];
      ORDER.forEach(function (k, i) { totals[k] += pts[i]; });
      rows.push({ q: q.id, short: q.short, answer: a, pts: pts });
    });
    return { totals: totals, rows: rows };
  }
  function pointFor(k, q, answers) {
    var a = answers[q];
    return a ? S.table[q][a][ORDER.indexOf(k)] : 0;
  }
  function rank(answers) {
    var sc = scoreAnswers(answers);
    var max = Math.max.apply(null, ORDER.map(function (k) { return sc.totals[k]; }));
    var tied = ORDER.filter(function (k) { return sc.totals[k] === max; });
    var sorted = tied.slice().sort(function (x, y) {
      for (var i = 0; i < S.tieBreak.length; i++) {
        var d = pointFor(y, S.tieBreak[i], answers) - pointFor(x, S.tieBreak[i], answers);
        if (d) return d;
      }
      return ORDER.indexOf(x) - ORDER.indexOf(y);
    });
    var decidedBy = null;
    if (tied.length > 1) {
      for (var i = 0; i < S.tieBreak.length; i++) {
        var q = S.tieBreak[i];
        var top = pointFor(sorted[0], q, answers);
        if (sorted.slice(1).some(function (k) { return pointFor(k, q, answers) !== top; })) { decidedBy = q; break; }
      }
    }
    return { totals: sc.totals, rows: sc.rows, max: max, primary: sorted[0], also: sorted.slice(1), isTie: tied.length > 1, decidedBy: decidedBy };
  }
  function reasonsFor(k, answers, max) {
    var idx = ORDER.indexOf(k), list = [];
    QS.forEach(function (q, qi) {
      var a = answers[q.id];
      if (!a) return;
      var text = (C.reasons[k] || {})[q.id + a];
      if (text) list.push({ p: S.table[q.id][a][idx], qi: qi, text: text });
    });
    // 有加分的答案依分數高到低排前面，沒加分的答案依題目順序補在後面
    list.sort(function (x, y) { return (y.p - x.p) || (x.qi - y.qi); });
    var out = list.slice(0, max).map(function (r) { return r.text; });
    if (out.length < Math.min(2, max)) out.push(C.courses[k].fallbackReason);
    return out;
  }
  window.RouQuiz = { scoreAnswers: scoreAnswers, rank: rank, reasonsFor: reasonsFor };

  /* ---------- 畫面 ---------- */
  var quiz = document.getElementById("quiz");
  var stage = document.getElementById("quiz-stage");
  var opener = document.getElementById("quiz-open");
  var state = { step: 0, answers: {} };
  var timer = null;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  var uid = 0;
  function art(key) { uid++; return (ART[key] || "").replace(/__/g, "_" + uid); }
  function picture(url, artKey, alt) {
    if (url) return '<img src="' + esc(url) + '" alt="' + esc(alt) + '" loading="lazy">';
    return art(artKey).replace("<svg ", '<svg role="img" aria-label="' + esc(alt) + '" ');
  }

  function viewQuestion(i) {
    var q = QS[i], chosen = state.answers[q.id];
    var bars = QS.map(function (_, j) { return '<i class="' + (j <= i ? "on" : "") + '"></i>'; }).join("");
    var body;
    if (q.type === "image") {
      body = '<fieldset class="pics' + (chosen ? " has-choice" : "") + '" role="radiogroup" aria-label="' + esc(q.title) + '">' +
        q.options.map(function (o) {
          var id = q.id + "-" + o.key, sel = chosen === o.key;
          return '<label class="pic' + (sel ? " is-selected" : "") + '" for="' + id + '">' +
            '<input type="radio" id="' + id + '" name="' + q.id + '" value="' + o.key + '"' + (sel ? " checked" : "") + '>' +
            '<span class="img">' + picture(o.image, o.art, o.alt) + '<span class="check" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>' +
            '<span class="cap"><span class="mark" aria-hidden="true">' + o.key + '</span><span>' + esc(o.text) + '</span></span>' +
            '</label>';
        }).join("") + '</fieldset>';
    } else {
      body = '<fieldset class="opts" role="radiogroup" aria-label="' + esc(q.title) + '">' +
        q.options.map(function (o) {
          var id = q.id + "-" + o.key, sel = chosen === o.key;
          return '<label class="opt' + (sel ? " is-selected" : "") + '" for="' + id + '">' +
            '<input type="radio" id="' + id + '" name="' + q.id + '" value="' + o.key + '"' + (sel ? " checked" : "") + '>' +
            '<span class="mark" aria-hidden="true">' + o.key + '</span>' +
            '<span class="opt-text">' + esc(o.text) + '</span></label>';
        }).join("") + '</fieldset>';
    }
    var last = i === QS.length - 1;
    return '<section class="screen">' +
      '<div class="progress"><span class="count">' + (i + 1) + ' / ' + QS.length + '</span><div class="bars" aria-hidden="true">' + bars + '</div></div>' +
      '<p class="q-label">' + esc(q.label) + '</p>' +
      '<h2 class="q-title" tabindex="-1">' + esc(q.title) + '</h2>' + body +
      '<div class="nav">' +
      '<button type="button" class="btn btn-ghost" data-act="prev"' + (i === 0 ? " disabled" : "") + '>上一題</button>' +
      '<button type="button" class="btn btn-solid" data-act="next" id="next-btn"' + (chosen ? "" : " disabled") + '>' + (last ? "看我的結果" : "下一題") + '</button>' +
      '</div><p class="nav-hint" id="nav-hint">' + (chosen ? "" : "選好一個答案，就能繼續") + '</p>' +
      '</section>';
  }

  function viewLoading() {
    return '<section class="screen loading"><div class="badge breathe" aria-hidden="true">柔</div><h2 class="sr" tabindex="-1">分析中</h2><p>正在為你調配專屬方子…</p></section>';
  }

  function bookControl(k, cls, label) {
    var c = C.courses[k];
    if (c.bookingUrl) return '<a class="' + cls + '" href="' + esc(c.bookingUrl) + '" target="_blank" rel="noopener">' + label + '</a>';
    return '<button type="button" class="' + cls + '" data-act="book" data-course="' + k + '">' + label + '</button>';
  }

  function viewResult() {
    var r = rank(state.answers), k = r.primary, c = C.courses[k];
    var shortOf = function (qid) { for (var i = 0; i < QS.length; i++) if (QS[i].id === qid) return QS[i].short; return ""; };
    var tieNote = "";
    if (r.isTie) {
      var names = [k].concat(r.also).map(function (x) { return "「" + C.courses[x].name + "」"; }).join("和");
      tieNote = '<p class="tie-note">' + names + '的分數相同，都很適合你。' +
        (r.decidedBy ? '我們依你在「' + shortOf(r.decidedBy) + '」的選擇，把' + c.name + '列為主要推薦。' : '') + '</p>';
    }
    var reasons = reasonsFor(k, state.answers, 3);
    var html = '<section class="screen">' +
      '<div class="result-head"><p class="eyebrow">YOUR RITUAL</p><h2 tabindex="-1">你的專屬頭療推薦</h2>' + tieNote + '</div>' +
      '<article class="course">' +
      '<div class="course-img">' + picture(c.image, k, c.name + "｜" + c.subtitle + " 形象圖") + '</div>' +
      '<div class="course-body">' +
      '<div class="course-title">' + (r.isTie ? '<span class="tag">主要推薦</span>' : '') +
      '<h3 class="course-name">' + esc(c.name) + '</h3><p class="course-sub">' + esc(c.subtitle) + '</p></div>' +
      '<div><p class="sec-label">為什麼推薦你</p><ul class="reasons">' + reasons.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>' +
      '<div><p class="sec-label">課程特色</p><ul class="features">' + c.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join("") + '</ul><p class="suits" style="margin-top:10px">' + esc(c.suits) + '</p></div>' +
      '<div class="actions">' + bookControl(k, "btn btn-solid", "立即預約") +
      '<button type="button" class="btn btn-ghost" data-act="restart">重新測驗</button></div>' +
      '<p class="book-note" role="status" hidden></p>' +
      '</div></article>';

    if (r.also.length) {
      html += '<div class="alts"><p class="alts-h">' + (r.also.length > 1 ? "另外兩個也很適合你" : "另一個也很適合你") + '</p>' +
        r.also.map(function (x) {
          var a = C.courses[x];
          return '<article class="alt"><div class="course-img">' + picture(a.image, x, a.name + " 形象圖") + '</div>' +
            '<div class="alt-body"><h3 class="alt-name">' + esc(a.name) + '</h3><p class="alt-sub">' + esc(a.subtitle) + '</p>' +
            '<p class="alt-why">' + esc(reasonsFor(x, state.answers, 1)[0]) + '</p>' +
            bookControl(x, "text-btn", "預約" + esc(a.name)) + '<p class="book-note" role="status" hidden></p></div></article>';
        }).join("") + '</div>';
    }

    html += '<p class="care"><b>小提醒</b>　' + esc(C.careNote) + '</p>' +
      '<div class="after"><button type="button" class="text-btn" data-act="edit">回到上一題修改答案</button></div>';

    if (C.settings.showScoreDetail) {
      var head = ORDER.map(function (x) { return '<th>' + esc(C.courses[x].name) + '</th>'; }).join("");
      var rows = r.rows.map(function (row) {
        return '<tr><td>' + esc(row.short) + '</td><td>' + row.answer + '</td>' + row.pts.map(function (p) { return '<td>' + p + '</td>'; }).join("") + '</tr>';
      }).join("");
      var foot = ORDER.map(function (x) { return '<td class="' + (r.totals[x] === r.max ? "win" : "") + '">' + r.totals[x] + '</td>'; }).join("");
      html += '<details class="detail"><summary>計分明細（僅預覽版顯示）</summary><div class="table-wrap"><table>' +
        '<thead><tr><th>題目</th><th>選擇</th>' + head + '</tr></thead><tbody>' + rows + '</tbody>' +
        '<tfoot><tr><td>總分</td><td></td>' + foot + '</tr></tfoot></table></div>' +
        '<p>同分時，依第 1 → 4 題的單題給分依序比較，決定主要推薦。</p></details>';
    }
    return html + '</section>';
  }

  function render(focus) {
    clearTimeout(timer);
    var s = state.step, html;
    if (s === "loading") html = viewLoading();
    else if (s === "result") html = viewResult();
    else html = viewQuestion(s);
    stage.innerHTML = html;
    quiz.scrollTop = 0;
    if (focus !== false) {
      var h = stage.querySelector("h2");
      if (h) h.focus({ preventScroll: true });
    }
    if (s === "loading") {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      timer = setTimeout(function () { state.step = "result"; render(); }, reduce ? 350 : 1300);
    }
  }

  function open() {
    state = { step: 0, answers: {} };
    quiz.hidden = false;
    document.documentElement.classList.add("quiz-lock");
    render();
  }
  function close() {
    clearTimeout(timer);
    quiz.hidden = true;
    document.documentElement.classList.remove("quiz-lock");
    opener.focus();
  }

  opener.addEventListener("click", open);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !quiz.hidden) close(); });

  quiz.addEventListener("change", function (e) {
    var t = e.target;
    if (!t.matches || !t.matches('input[type="radio"]')) return;
    state.answers[t.name] = t.value;
    var group = t.closest("fieldset");
    group.querySelectorAll("label").forEach(function (l) { l.classList.toggle("is-selected", l.contains(t)); });
    group.classList.add("has-choice");
    var next = document.getElementById("next-btn");
    if (next) next.disabled = false;
    var hint = document.getElementById("nav-hint");
    if (hint) hint.textContent = "";
  });

  quiz.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var act = b.getAttribute("data-act"), s = state.step;
    if (act === "close") close();
    else if (act === "prev" && typeof s === "number" && s > 0) { state.step = s - 1; render(); }
    else if (act === "next" && typeof s === "number") {
      if (!state.answers[QS[s].id]) return;          // 未作答不得前進
      state.step = s === QS.length - 1 ? "loading" : s + 1; render();
    }
    else if (act === "restart") { state.answers = {}; state.step = 0; render(); }
    else if (act === "edit") { state.step = QS.length - 1; render(); }
    else if (act === "book") {
      var note = b.closest("article").querySelector(".book-note");
      var name = C.courses[b.getAttribute("data-course")].name;
      note.textContent = "預覽版：正式上線後，這裡會直接帶你到官網「" + name + "」的預約頁。";
      note.hidden = false;
    }
  });
})();
</script>
